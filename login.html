<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Commercial Creativity | Slalom</title>
<style>
  :root{
    --navy:#002FAF;
    --cyan:#1BE1F2;
    --coral:#FF4D5F;
    --ink:#0A0A0A;
    --grey:#666666;
    --paper:#FFFFFF;
    --font: 'Avenir Next LT Pro','Avenir Next','Avenir','Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:var(--font);
    background:var(--navy);
    color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }
  body::after{
    content:"";position:absolute;right:-10%;top:-30%;
    width:640px;height:640px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(27,225,242,0.35), rgba(12,98,251,0) 70%);
    pointer-events:none;
  }
  .card{
    position:relative;z-index:1;
    width:100%;max-width:380px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:16px;
    padding:36px 32px 32px;
  }
  .logo-mark{height:20px;width:auto;color:var(--paper);margin-bottom:28px;display:block;}
  h1{font-size:20px;font-weight:800;margin:0 0 8px;letter-spacing:-0.01em;}
  p.sub{font-size:14px;line-height:1.5;color:rgba(255,255,255,0.65);margin:0 0 24px;}
  form{display:flex;flex-direction:column;gap:14px;}
  label{font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.6);}
  input[type="password"]{
    font-family:var(--font);
    background:rgba(255,255,255,0.08);
    border:1.5px solid rgba(255,255,255,0.2);
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;color:var(--paper);
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="password"]:focus{border-color:var(--cyan);}
  input[type="password"]::placeholder{color:rgba(255,255,255,0.35);}
  button{
    font-family:var(--font);
    font-size:14.5px;font-weight:800;
    background:var(--cyan);color:var(--ink);
    border:none;border-radius:10px;
    padding:12px 14px;margin-top:6px;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{opacity:0.88;}
  .error{
    display:none;
    font-size:13px;font-weight:700;color:#FFB3BA;
    background:rgba(255,77,95,0.14);
    border:1px solid rgba(255,77,95,0.3);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:2px;
  }
  .error.show{display:block;}
</style>
</head>
<body>
  <div class="card">
    <svg class="logo-mark" viewBox="0 0 216 56.1" xmlns="http://www.w3.org/2000/svg" aria-label="Slalom">

      </g>
    </svg>
    <h1>Commercial Creativity</h1>
    <p class="sub">Internal deal-shaping reference. Enter the password to continue.</p>
    <div class="error" id="errorBox">Incorrect password. Try again.</div>
    <form method="POST" action="/login" id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autofocus required>
      <button type="submit">Enter</button>
    </form>
  </div>
  <script>
    // Show the error state if we were bounced back here after a wrong attempt.
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('errorBox').classList.add('show');
    }
  </script>
</body>
</html>
